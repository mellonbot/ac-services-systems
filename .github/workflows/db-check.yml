name: db-check

# Manual only. Connects to the production database the way the gateway does —
# node `pg`, not psql — and prints what pg sees. psql turns TLS on by itself;
# pg only does what the connection string says, so a string that migrates
# cleanly can still refuse the gateway. Prints no secret: host and sslmode only.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  db-check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Production secrets run only the code on main: a dispatch from any other
      # branch would run that branch's code with them. (The production
      # environment's deployment-branch rule should say the same.)
      - name: dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::this workflow runs against production and only from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod
      - name: connect with pg
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module -e '
            import pg from "pg";
            import { forNodePg } from "./services/gateway/src/db/pg-url.ts";
            const raw = process.env.DATABASE_URL, url = forNodePg(raw);
            const u = new URL(raw);
            console.log("host", u.hostname, "port", u.port || "(default)", "db", u.pathname, "sslmode", u.searchParams.get("sslmode") ?? "(none)", "sslrootcert", u.searchParams.get("sslrootcert") ?? "(none)", "stripped", raw !== url);
            const c = new pg.Client({ connectionString: url, application_name: "ac-db-check" });
            try {
              await c.connect();
              const who = await c.query("select current_user, version(), (select rolsuper from pg_roles where rolname = current_user) as superuser, (select rolcreaterole from pg_roles where rolname = current_user) as createrole, (select rolbypassrls from pg_roles where rolname = current_user) as bypassrls");
              console.log(who.rows[0]);
              const roles = await c.query("select rolname, pg_has_role(current_user, rolname, $1) as member from pg_roles where rolname like $2 order by 1", ["MEMBER", "ac_%"]);
              console.table(roles.rows);
              for (const r of ["ac_gateway", "ac_worker"]) {
                // regions: a table both roles are granted, read under the system binding the gateway and worker use.
                try { await c.query("BEGIN"); await c.query(`SET LOCAL ROLE ${r}`); await c.query("select set_config($1, $2, true)", ["ac.namespace", "system"]); const t = await c.query("select count(*)::int as n from regions"); await c.query("ROLLBACK"); console.log(`SET LOCAL ROLE ${r}: ok; regions rows visible: ${t.rows[0].n}`); }
                catch (e) { await c.query("ROLLBACK").catch(() => {}); console.error(`SET LOCAL ROLE ${r}: FAILED — ${e.message} ${e.code ?? ""}`); process.exitCode = 1; }
              }
              await c.query("LISTEN ac_db_check"); console.log("LISTEN ok");
              await c.end();
            } catch (e) { console.error("pg failed:", e.message, e.code ?? ""); process.exit(1); }
          '
