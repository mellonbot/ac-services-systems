name: msa-terms-audit

# Manual only. Read-only against production: lists every active MSA missing a
# term the activation gate requires, and every customer with sites and no MSA
# in effect. A red run means some dispatcher would be refused `no_value`.
# Zero-install: the script imports the term register and shells out to psql.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "As-of date (YYYY-MM-DD). Empty = today."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Production secrets run only the code on main: a dispatch from any other
      # branch would run that branch's code with them. (The production
      # environment's deployment-branch rule should say the same.)
      - name: dispatched from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::this workflow runs against production and only from main, not $GITHUB_REF"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AS_OF: ${{ inputs.as_of }}
        run: node tools/ops/audit-msa-terms.ts $AS_OF
