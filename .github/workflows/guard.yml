name: guard

on: [push, pull_request]

# The workflow reads the repository and nothing else. Stated rather than
# inherited, because the default token permissions are a repository setting
# somebody can widen without touching this file.
permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs first and alone. Dependency-free by design: if the invariants are
  # broken there is no reason to spend three minutes installing a toolchain to
  # find that out.
  zero-install-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/ci/schema-guard.ts

  full:
    runs-on: ubuntu-latest
    needs: zero-install-guard
    steps:
      - uses: actions/checkout@v7
      # No version here: pnpm/action-setup reads `packageManager` from
      # package.json. A version pinned in both places is two sources of truth,
      # and the one in the workflow is the one nobody updates.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Type stripping runs the code without checking it. The compliance gate,
      # the branded StorageKey and the clearance symbol are mechanisms that
      # exist only in the type system — untypechecked, they are comments.
      - run: pnpm typecheck
      - run: pnpm guard:lint
      - run: pnpm test
      - name: generated artifacts are current
        run: |
          node tools/ci/emit-schema.ts
          node tools/ci/emit-surfaces.ts
          # --porcelain rather than `git diff`: adding a surface to the registry
          # emits a NEW app directory, and an untracked file is invisible to a diff.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files drifted. Run the emitters and commit."
            exit 1
          fi

  # The definitions and the database can disagree, and the disagreement is the
  # interesting case. This job is the only place the live schema is checked.
  migrate:
    runs-on: ubuntu-latest
    needs: zero-install-guard
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ac_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ac_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # No pnpm install: the migration path is dependency-free on purpose, and
      # CI running it the same way a laptop does is what keeps it that way.
      - run: node tools/ci/migrate.ts
      - name: region_id is still total in the live schema
        run: node tools/ci/migrate.ts --assert
      - name: migrations are idempotent
        run: |
          out=$(node tools/ci/migrate.ts)
          echo "$out"
          case "$out" in
            *"nothing to do"*) ;;
            *) echo "::error::A second run applied something. A migration is not recording itself." && exit 1 ;;
          esac
