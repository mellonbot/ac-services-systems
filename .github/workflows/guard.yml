name: guard

on: [push, pull_request, workflow_dispatch]

# The workflow reads the repository and nothing else. Stated rather than
# inherited, because the default token permissions are a repository setting
# somebody can widen without touching this file.
permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependency-free by design: it answers in about ten seconds, so a broken
  # invariant is the first red mark on the run. `full`, `migrate` and `drive`
  # start beside it rather than behind it — holding them back cost every deploy
  # its ten seconds to save a few runner-minutes on a commit that fails anyway.
  zero-install-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/ci/schema-guard.ts
      # The unit suite is zero-install too: relative .ts imports, node:test, type stripping.
      # packages/ui is the one exception — its render tests need preact installed — and
      # runs in `full` below as `test:ui`. The guard fails a package that has no tests at all.
      - run: npm run guard:test

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No version here: pnpm/action-setup reads `packageManager` from
      # package.json. A version pinned in both places is two sources of truth,
      # and the one in the workflow is the one nobody updates.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Type stripping runs the code without checking it. The compliance gate,
      # the branded StorageKey and the clearance symbol are mechanisms that
      # exist only in the type system — untypechecked, they are comments.
      - run: pnpm typecheck
      # tsconfig.json leaves out the AC Logins app's Electron files (main,
      # preload, renderer): they need electron's types, which live in the app's
      # own npm install. Check them here, with the app's own tsconfig.
      # --ignore-scripts: the types are enough; the Electron binary is not fetched.
      - name: AC Logins typechecks
        run: |
          npm ci --ignore-scripts --prefix tools/logins-app
          pnpm exec tsc -p tools/logins-app/tsconfig.json
      - run: pnpm guard:lint
      # The component set renders to a string under node --test; needs preact, so it lives here.
      - run: npm run test:ui
      # The one build step. Every enabled surface bundles, browser-only, from its emitted frame.
      - run: node tools/ci/build-surface.ts --all --minify
      - name: unified Cloudflare Pages package
        run: pnpm build:pages
        env:
          AC_GATEWAY: https://api.example.invalid
      - name: generated artifacts are current
        run: |
          node tools/ci/emit-schema.ts
          node tools/ci/emit-surfaces.ts
          # --porcelain rather than `git diff`: adding a surface to the registry
          # emits a NEW app directory, and an untracked file is invisible to a diff.
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::Generated files drifted. Run the emitters and commit."
            exit 1
          fi

  # The definitions and the database can disagree, and the disagreement is the
  # interesting case. This job is the only place the live schema is checked.
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ac_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ac_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # No pnpm install: the migration path is dependency-free on purpose, and
      # CI running it the same way a laptop does is what keeps it that way.
      - run: node tools/ci/migrate.ts
      - name: region_id is still total in the live schema
        run: node tools/ci/migrate.ts --assert
      - name: migrations are idempotent
        run: |
          out=$(node tools/ci/migrate.ts)
          echo "$out"
          case "$out" in
            *"nothing to do"*) ;;
            *) echo "::error::A second run applied something. A migration is not recording itself." && exit 1 ;;
          esac
      # The backbone contract, every claim, against the live database. Needs pg.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - run: npm run test:integration

  # The DOM is the one layer neither the render tests nor the wire tests
  # can see, and C4 shipped with two defects that lived exactly there: a
  # default that was a DOM property surviving a `form.reset()`, and a pill
  # printing a raw enum beside a chip that printed words. Both need a real
  # browser and two actions in a row. ubuntu-latest ships Chrome; the drive
  # finds it, and skips loudly rather than silently if it ever stops.
  #   s2-c4 — C4 through a real browser.
  #   s6    — item 6: the customer portal, two principals, one bundle — the DOM
  #           half of "tier scoping is the acceptance test"
  #           (test/integration/s6.test.ts is the wire half).
  #   s8    — item 7: the subcontractor portal, two firms, one bundle — the DOM
  #           half of firm visibility (test/integration/s8.test.ts is the wire
  #           half), and D12's four writes from the page: enroll, file,
  #           acknowledge, dispute.
  #   s1    — item 8: the marketing surface, whose principal is nobody. The DOM
  #           half of the anonymous door (test/integration/s1.test.ts is the
  #           wire half), and the only place two of its mechanisms can be
  #           checked at all: the durable buffer surviving a reload, and the
  #           D7a/OQ6 copy ceiling against the PAINTED page, so a promise
  #           arriving through a stylesheet fails too.
  #   c3-amped — the C3 acceptance drive: Amped's fixture authored through the
  #           real operations against a live gateway, then resolved and its
  #           illegal rows refused by the real resolver. No browser.
  # One job per drive: each creates, migrates and drops its own database, so
  # they share nothing, and side by side they cost the deploy one drive's
  # time (~40s) instead of four (~2.5m).
  drive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        surface: [s2-c4, s6, s8, s1, c3-amped]
    name: drive (${{ matrix.surface }})
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ac_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ac_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      # The drives used to follow `migrate` in one job, on a server whose roles
      # the migration had already made. Make them here too, so a drive sees the
      # server it always saw.
      - run: node tools/ci/migrate.ts
      - run: pnpm install --frozen-lockfile
      - run: npm run drive:${{ matrix.surface }}

  # A re-run of an older commit passes every check above and would then deploy
  # it over whatever main has moved on to — a silent rollback. Deploy only the
  # commit that is main's head right now; a re-run of the head still deploys.
  latest:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [zero-install-guard, full, migrate, drive]
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" -q .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA is not main's head ($head), so it is not deployed. Re-run the head's workflow to redeploy."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

  # The gateway: apps/gateway and apps/worker as one container behind the Worker
  # on api.acservice.systems (infra/cloudflare/). Migrate the production database,
  # build and push the image, wait for /healthz on the domain. Everything it needs
  # lives on the `production` environment like the Pages deploy below, plus
  # DATABASE_URL — the one value the site does not need. Until that is set the
  # job says so once and skips every step, so the site still publishes; a half-set
  # environment (token without account, or the Worker missing a secret) fails
  # here, named, before a several-minute image build and a five-minute wait.
  deploy-gateway:
    if: needs.latest.outputs.current == 'true'
    runs-on: ubuntu-latest
    needs: [full, migrate, drive, latest]
    environment:
      name: production
      url: https://api.acservice.systems/healthz
    concurrency:
      group: cloudflare-gateway-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - name: production environment is configured for the gateway
        id: configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL is not set on the GitHub 'production' environment, so the gateway is not deployed and the site publishes alone. See docs/CLOUDFLARE_PAGES.md, 'The gateway'."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the GitHub 'production' environment. See docs/CLOUDFLARE_PAGES.md, 'The site'."
              missing=1
            fi
          done
          [ "$missing" = 0 ] && echo "ready=true" >> "$GITHUB_OUTPUT"
          exit $missing
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 22 }
      # The Worker holds its own copy of DATABASE_URL and the signing key, set once
      # from a laptop (docs/CLOUDFLARE_PAGES.md, 'The gateway'). Without the key the
      # Worker refuses to start the container and the wait below would time out
      # saying nothing. Ask the Worker what it holds, and name what it does not.
      - name: the Worker holds its secrets
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! held=$(pnpm dlx wrangler@4.148.0 secret list -c infra/cloudflare/wrangler.jsonc 2>&1); then
            echo "$held"
            echo "::error::The Worker 'ac-gateway' has no secrets yet. Run the one-time setup in docs/CLOUDFLARE_PAGES.md, 'The gateway'."
            exit 1
          fi
          missing=0
          for name in AC_SIGNING_KEY_PEM DATABASE_URL; do
            if ! grep -q "\"$name\"" <<< "$held"; then
              echo "::error::$name is not set on the Worker: npx wrangler@4.148.0 secret put $name -c infra/cloudflare/wrangler.jsonc"
              missing=1
            fi
          done
          exit $missing
      # psql is on the runner image, as it is on any machine that migrates a
      # database; the runner is dependency-free on purpose (see `migrate`).
      - name: Migrate the production database
        if: steps.configured.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node tools/ci/migrate.ts
          node tools/ci/migrate.ts --assert
      # Builds the image with the runner's Docker, pushes it to the account's
      # registry, uploads the Worker, and creates the api.acservice.systems custom
      # domain from the `routes` entry on the first run. Run directly for the same
      # reason the Pages deploy is: cloudflare/wrangler-action cannot `pnpm add`
      # at a workspace root.
      - name: Deploy the gateway container
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.148.0 deploy -c infra/cloudflare/wrangler.jsonc
      - name: The gateway answers on its domain
        if: steps.configured.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://api.acservice.systems/healthz; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::api.acservice.systems/healthz did not answer within five minutes. \`npx wrangler@4.148.0 tail -c infra/cloudflare/wrangler.jsonc\` shows why the Worker would not start it."
          exit 1

  deploy:
    if: needs.latest.outputs.current == 'true'
    runs-on: ubuntu-latest
    # After the gateway, because the build stamps the gateway origin into every
    # frame. A skipped gateway (DATABASE_URL unset) still satisfies this.
    needs: [full, migrate, drive, latest, deploy-gateway]
    environment:
      name: production
      url: https://acservice.systems
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      # Every value the deploy needs lives on the `production` environment, and an
      # environment with a value missing fails late and obscurely: an empty
      # `--project-name=` reaches wrangler, an empty token reaches Cloudflare. Eight
      # red runs on main were this. Check up front and name what is missing.
      - name: production environment is configured
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_PAGES_PROJECT CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the GitHub 'production' environment. See docs/CLOUDFLARE_PAGES.md, 'The site'."
              missing=1
            fi
          done
          exit $missing
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build unified site
        run: pnpm build:pages
        env:
          AC_GATEWAY: ${{ vars.AC_GATEWAY || 'https://api.acservice.systems' }}
      # wrangler is run directly rather than through cloudflare/wrangler-action: the
      # action sees pnpm-lock.yaml and tries `pnpm add wrangler`, which pnpm refuses
      # at a workspace root. `pnpm dlx` fetches the pinned version and adds nothing —
      # an exact version, because this step holds the Cloudflare token.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: pnpm dlx wrangler@4.148.0 pages deploy dist/pages --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main
