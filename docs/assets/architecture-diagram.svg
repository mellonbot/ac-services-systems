<?xml version="1.0" encoding="UTF-8"?>
<!-- Arc Foundry, light stock. Every hex is a value in docs/generated/BRAND.md. Category is carried by form and label, never hue. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>
    .page { fill: #E6EBF0; }
    .title { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", Arial, sans-serif; font-weight: 600; font-size: 28px; fill: #0E1418; }
    .eyebrow { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.14em; fill: #3C4A55; }
    .id { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; font-size: 16px; fill: #0E1418; }
    .box-title { font-family: "IBM Plex Sans Condensed", "IBM Plex Sans", Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #0E1418; }
    .box-text { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 12px; fill: #3C4A55; }
    .surface { fill: #F3F6F9; stroke: #8695A2; stroke-width: 1; }
    .core { fill: #F3F6F9; stroke: #0E1418; stroke-width: 2; }
    .data { fill: #D4DCE4; stroke: #0E1418; stroke-width: 2; }
    .rule { fill: #0E1418; }
    .arrow { stroke: #3C4A55; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3C4A55"/>
    </marker>
  </defs>
  <rect class="page" width="1200" height="680"/>
  <text x="30" y="34" class="eyebrow">RANKINE OPERATING COMPANY</text>
  <text x="30" y="62" class="title">AC Platform architecture</text>

  <!-- Surfaces -->
  <g id="surfaces">
    <rect class="surface" x="30" y="90" width="120" height="70" rx="6"/>
    <text x="42" y="114" class="id">S1</text>
    <text x="42" y="134" class="box-text">Front door</text>
    <text x="42" y="149" class="box-text">Everyone</text>

    <rect class="surface" x="165" y="90" width="120" height="70" rx="6"/>
    <text x="177" y="114" class="id">S2</text>
    <text x="177" y="134" class="box-text">Service Manager</text>
    <text x="177" y="149" class="box-text">Office</text>

    <rect class="surface" x="300" y="90" width="120" height="70" rx="6"/>
    <text x="312" y="114" class="id">S3</text>
    <text x="312" y="134" class="box-text">Dispatch</text>
    <text x="312" y="149" class="box-text">Dispatcher</text>

    <rect class="surface" x="435" y="90" width="120" height="70" rx="6"/>
    <text x="447" y="114" class="id">S4</text>
    <text x="447" y="134" class="box-text">HQ Dashboard</text>
    <text x="447" y="149" class="box-text">Leadership</text>

    <rect class="surface" x="570" y="90" width="120" height="70" rx="6"/>
    <text x="582" y="114" class="id">S5</text>
    <text x="582" y="134" class="box-text">Technician</text>
    <text x="582" y="149" class="box-text">Field</text>

    <rect class="surface" x="705" y="90" width="120" height="70" rx="6"/>
    <text x="717" y="114" class="id">S6</text>
    <text x="717" y="134" class="box-text">Customer Portal</text>
    <text x="717" y="149" class="box-text">Customer</text>

    <rect class="surface" x="840" y="90" width="120" height="70" rx="6"/>
    <text x="852" y="114" class="id">S7</text>
    <text x="852" y="134" class="box-text">Vendor Portal</text>
    <text x="852" y="149" class="box-text">Vendor · Phase 4</text>

    <rect class="surface" x="975" y="90" width="120" height="70" rx="6"/>
    <text x="987" y="114" class="id">S8</text>
    <text x="987" y="134" class="box-text">Subcontractor</text>
    <text x="987" y="149" class="box-text">Firm</text>
  </g>

  <line class="arrow" x1="600" y1="170" x2="600" y2="220"/>

  <rect class="core" x="450" y="230" width="300" height="70" rx="6"/>
  <rect class="rule" x="450" y="230" width="300" height="3"/>
  <text x="470" y="258" class="box-title">S0 Shared shell</text>
  <text x="470" y="279" class="box-text">Login · Context · Events · Refusals</text>

  <line class="arrow" x1="600" y1="310" x2="600" y2="360"/>

  <rect class="core" x="430" y="370" width="340" height="70" rx="6"/>
  <rect class="rule" x="430" y="370" width="340" height="3"/>
  <text x="450" y="398" class="box-title">Gateway</text>
  <text x="450" y="419" class="box-text">Operation catalogue · Unit of work · RLS binding</text>

  <line class="arrow" x1="600" y1="450" x2="600" y2="500"/>

  <rect class="data" x="460" y="510" width="280" height="70" rx="6"/>
  <text x="480" y="538" class="box-title">PostgreSQL 18</text>
  <text x="480" y="559" class="box-text">Row-Level Security · Triggers · Migrations</text>

  <!-- Legend: form, not hue -->
  <rect class="surface" x="30" y="620" width="30" height="20" rx="6"/>
  <text x="70" y="635" class="box-text">Surface — hairline rule</text>
  <rect class="core" x="230" y="620" width="30" height="20" rx="6"/>
  <text x="270" y="635" class="box-text">Core — hard rule</text>
  <rect class="data" x="400" y="620" width="30" height="20" rx="6"/>
  <text x="440" y="635" class="box-text">Data — sunken well</text>
</svg>
