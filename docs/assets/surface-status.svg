    .status-ok { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #0E6A46; }
    .status-blocked { font-family: "IBM Plex Sans", Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #3C4A55; }
