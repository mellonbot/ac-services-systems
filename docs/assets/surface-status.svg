<?xml version="1.0" encoding="UTF-8"?>
<!-- Arc Foundry, light stock. Every hex is a value in docs/generated/BRAND.md. State carries a mark and a word, never hue alone. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <style>
